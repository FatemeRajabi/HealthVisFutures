	"sanhita": { name: "Sanhita Paluskar", role: "Past Contributor – Software Engineer", info: "Sanhita completed her graduation from Carleton University. She has professional experience as a software development engineer in building web applications and is certified in Core Java and Full Stack Development.", imgsrc: "../images/studentImages/Sanhita.png" },
	"ali-shajari": { name: "Ali Shajari", role: "Past Contributor – SaPP Student", info: "Ali contributed to the team as a SaPP student for the Fall 2023 semester, focusing on creating educational materials for SYSC 4906, Intro to Data Science & Data Visualization. He also worked as a Research Assistant for the Morrisseau Project.", imgsrc: "../images/studentImages/Ali.jpg" },
	"sam-serdah": { name: "Sam Serdah", role: "Past Contributor – MASc (Data Science)", info: "Sam joined the research team in September 2022 as a graduate student in MASc with interest in Data Science and Analytics. He worked on a data visualization project with focus on healthcare integration. Sam has a background in applied health science and health informatics from the University of Waterloo.", imgsrc: "../images/studentImages/Sam.jpeg" }
};

/* ── Render person page ── */
const key = new URLSearchParams(window.location.search).get('key');
const info = PEOPLE_INFO[key] || {};

document.title = (info.name || 'Person') + ' – HealthVisFutures Lab';
document.getElementById('profileImg').src = info.imgsrc || '../images/studentImages/dummy.png';
document.getElementById('profileImg').alt = info.name || '';
document.getElementById('profileName').textContent = info.name || '';
document.getElementById('profileRole').textContent = info.role || '';
document.getElementById('profileBio').textContent = info.info || '';

const degsEl = document.getElementById('profileDegrees');
if (info.degrees && info.degrees.length) {
	info.degrees.forEach(d => { const li = document.createElement('li'); li.textContent = d; degsEl.appendChild(li); });
} else {
	degsEl.style.display = 'none';
}

const links = info.connectWithMe || {};
document.getElementById('profileLinks').innerHTML = Object.entries(links).map(([label, href]) => {
	const iconClass = LINK_ICONS[label] || 'fas fa-link';
	const isEmail = href.startsWith('mailto:');
	return `<a class="person-link-pill" href="${href}" ${isEmail ? '' : 'target="_blank" rel="noopener"'}>
		<i class="${iconClass}"></i> ${label}
	</a>`;
}).join('');

/* ── Publications ── */
if (typeof publications !== 'undefined' && key) {
	const personPubs = publications.filter(pub =>
		pub.authors.some(a => a.url && a.url.includes('people=' + key))
	);
	if (personPubs.length) {
		document.getElementById('pubSection').style.display = '';
		personPubs.forEach(pub => {
			document.getElementById('pubList').appendChild(buildPubItem(pub));
		});
	}
}

function buildPubItem(pub) {
	const awardHtml = pub.award ? `<span class="pub-award">&#9733; ${pub.award}</span>` : '';
	const authorNames = pub.authors.map(a => a.name).join(', ');
	const item = document.createElement('div');
	item.className = 'pub-item';
	item.innerHTML = `
		<div class="row align-items-center">
			<div class="col-md-3 mb-2 mb-md-0">
				<img class="pub-list-img" src="../${pub.imgSrc}" alt="">
			</div>
			<div class="col-md-9">
				<div class="pub-badges"><span class="pub-event">${pub.event}</span>${awardHtml}</div>
				<p class="pub-list-title">${pub.title}</p>
				<p class="pub-list-authors">${authorNames}</p>
				<p class="pub-list-venue">${pub.additionalDetails || ''}</p>
			</div>
		</div>`;
	item.addEventListener('click', () => openPubModal(pub));
	return item;
}

function openPubModal(pub) {
	document.getElementById('modalTitle').textContent = pub.title;
	document.getElementById('modalImg').src = '../' + pub.imgSrc;
	document.getElementById('modalLink').href = pub.downloadLink;
	document.getElementById('modalVenue').textContent = pub.additionalDetails || '';
	document.getElementById('modalAbstract').textContent = pub.abstract || 'Abstract not available.';
	document.getElementById('modalEventBadge').textContent = pub.event;
	const awardEl = document.getElementById('modalAwardBadge');
	if (pub.award) { awardEl.innerHTML = '&#9733; ' + pub.award; awardEl.style.display = ''; }
	else { awardEl.style.display = 'none'; }
	document.getElementById('modalAuthors').innerHTML = pub.authors.map(a =>
		`<span class="modal-author-chip"><img src="../${a.imgSrc}" alt=""><span>${a.name}</span></span>`
	).join('');
	$('#pubModal').modal('show');
}
</script>
</body>
</html>
