		/* Card — horizontal: photo left, text right */

		}
		.person-card:hover img { border-color: #2d3748; }

		/* Smaller images for alumni/past */

		.person-name {

			color: #2d3748; line-height: 1.3; margin-bottom: 4px;
		}
		.person-role { font-size: 0.88em; color: #999; line-height: 1.45; white-space: pre-line; }
		.alumni-card .person-name { font-size: 0.96em; }
		.alumni-card .person-role { font-size: 0.82em; }

/* col class, small = alumni/past style */
function buildCard(person, colClass, small) {
	const col = document.createElement('div');
	col.className = colClass + ' mb-2';
	const card = document.createElement('div');
	card.className = 'person-card' + (small ? ' alumni-card' : '');
	card.innerHTML = `
		<img src="${person.imgsrc}" alt="${person.name}" onerror="this.src='images/studentImages/dummy.png'">
		<div>
			<div class="person-name">${person.name}</div>
			<div class="person-role">${person.role}</div>
		</div>`;
	card.addEventListener('click', () => window.location = 'person.html?key=' + person.link);
	col.appendChild(card);
	return col;
}

function renderGrid(id, people, colClass, small) {
	const g = document.getElementById(id);
	if (!people.length) { g.closest('.group-section').style.display = 'none'; return; }
	people.forEach(p => g.appendChild(buildCard(p, colClass, small)));
}

renderGrid('profGrid',      PEOPLE_LIST.professors, 'col-md-6');

renderGrid('gradGrid',      PEOPLE_LIST.grads,      'col-md-6');
renderGrid('undergradGrid', PEOPLE_LIST.undergrads, 'col-md-6');
renderGrid('alumniGrid',    PEOPLE_LIST.alumni,     'col-md-4', true);
renderGrid('pastGrid',      PEOPLE_LIST.past,       'col-md-4', true);

window.addEventListener('load', function() {

	const map = { professors:'professors', postdoc:'postdoc', grad:'grad', undergrad:'undergrad', alumni:'alumni', past:'past', ra:'alumni' };

});
